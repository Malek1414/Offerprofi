<!--
  The maskable variant of the product mark.

  The mark itself is not invented here. It already exists as src/app/icon.svg, which
  Next serves at /icon.svg as the favicon, and a home-screen icon that differs from the
  browser-tab icon is two marks for one product. So this file is that same artwork —
  same rounded ground, same ring, same arrow, scaled 8x from its 64 unit viewBox — with
  exactly two changes, both forced by how Android draws icons.

  Change one: the ground bleeds to all four edges instead of carrying our own rounded
  corner. Android does not draw the icon we ship, it draws whatever survives a mask the
  launcher chooses (circle, squircle, rounded square, teardrop). Ship a pre-rounded
  square and the launcher rounds it again, leaving a visible ring of background inside
  the mask.

  Change two: the artwork is scaled to 0.80 about the centre. The safe area is the
  central 80% circle, radius 205 of 512. At full size the arrow's outer corner sits
  237 from the centre and the roundest launchers cut the tip off it; at 0.80 that
  corner falls to 190 and the ring's outer edge to 141, both comfortably inside.

  This file is also the source for apple-touch-icon.png, for the same reason: iOS
  applies its own superellipse mask and wants a square to apply it to.

  Keep this in step with src/app/icon.svg. If the mark changes there, it changes here,
  and the PNGs in this directory are re-rendered from both.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="App">
  <rect width="512" height="512" fill="#171714" />
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <circle cx="256" cy="256" r="144" fill="none" stroke="#f6f0e4" stroke-width="64" />
    <path d="M256 112h136v136" fill="none" stroke="#d88746" stroke-width="56" stroke-linecap="round" />
  </g>
</svg>
