<!--
  The app mark.

  Achromatic on purpose, and this is the same rule globals.css states for the whole
  chassis: this system hosts someone else's brand. An icon with a hue in it would sit
  on Lisa's home screen next to her own Instagram grid and fight whatever colour her
  agency uses — and the agency colour is the one that is allowed to be loud here.
  Ink on paper, the two values taken verbatim from the ink and paper custom
  properties in src/app/globals.css: #14161c on #fcfcfd.

  (XML comments cannot contain a double hyphen, which is why the tokens are named in
  prose here rather than written out as CSS variables. Editing this file with a
  literal token name in a comment makes it unparseable, and the failure surfaces as
  a corrupt-header error from the icon build, not as anything about SVG.)

  The glyph is a quote read from four feet away: two line items, a sum rule, and a
  total set shorter and heavier than everything above it. Nothing thinner than 12px
  at a 512 box, because the icon is looked at as a 48px tile and hairlines disappear
  there. No fold-corner, no euro sign, no chat bubble — all three test badly at 48px
  and the total bar is the one shape that still reads.

  Geometry note for anyone editing: the content box is x 96..416, y 139..373, which
  centres exactly on (256, 256). icon-maskable.svg reuses these same rectangles at
  0.85 scale about that centre so the Android safe circle cannot clip them. Keep the
  two files in step or the maskable variant stops being a variant.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Angebot">
  <rect width="512" height="512" rx="112" fill="#14161c" />
  <g fill="#fcfcfd">
    <rect x="96" y="139" width="320" height="36" rx="18" />
    <rect x="96" y="199" width="248" height="36" rx="18" />
    <rect x="96" y="273" width="320" height="12" rx="6" />
    <rect x="96" y="321" width="176" height="52" rx="26" />
  </g>
</svg>
